name: BitTorrent M0

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/nzbd-torrent/**
      - crates/nzbd/src/main.rs
      - crates/nzbd/src/tls.rs
      - scripts/check-bittorrent-deps.sh
      - .github/workflows/bittorrent-m0.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/nzbd-torrent/**
      - crates/nzbd/src/main.rs
      - crates/nzbd/src/tls.rs
      - scripts/check-bittorrent-deps.sh
      - .github/workflows/bittorrent-m0.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-policy:
    name: exact engine + Rust TLS only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bittorrent-m0-dependency-policy
      - name: Check the pinned engine and TLS graph
        run: scripts/check-bittorrent-deps.sh

  native:
    name: ${{ matrix.name }} (Rust 1.85)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: bittorrent-m0-${{ matrix.target }}
      - name: Run the isolated adapter suite
        run: cargo test --locked -p nzbd-torrent --target ${{ matrix.target }}

  musl:
    name: ${{ matrix.name }} (Rust 1.85)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: bittorrent-m0-${{ matrix.target }}
      - name: Run the isolated adapter suite
        run: cargo test --locked -p nzbd-torrent --target ${{ matrix.target }}
