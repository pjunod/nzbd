name: BitTorrent fuzz

on:
  pull_request:
    paths:
      - Makefile
      - Cargo.lock
      - crates/nzbd-torrent/**
      - fuzz/**
      - scripts/check-bittorrent-fuzz-deps.sh
      - .github/workflows/bittorrent-fuzz.yml
  push:
    branches: [main]
    paths:
      - Makefile
      - Cargo.lock
      - crates/nzbd-torrent/**
      - fuzz/**
      - scripts/check-bittorrent-fuzz-deps.sh
      - .github/workflows/bittorrent-fuzz.yml
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  metainfo-preflight:
    name: metainfo preflight (libFuzzer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-01
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Check fuzz harness formatting
        run: cargo +nightly-2026-08-01 fmt --manifest-path fuzz/Cargo.toml -- --check

      - name: Run bounded pull-request fuzzing
        if: github.event_name != 'schedule'
        run: make fuzz-metainfo

      - name: Run scheduled five-minute fuzzing
        if: github.event_name == 'schedule'
        run: make fuzz-metainfo FUZZ_SECONDS=300

      - name: Upload reproducer on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metainfo-preflight-reproducer
          path: fuzz/artifacts/metainfo_preflight/
          if-no-files-found: ignore
