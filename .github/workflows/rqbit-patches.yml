name: rqbit contribution patches

on:
  push:
    branches: [main]
    paths:
      - contrib/rqbit/*.patch
      - contrib/rqbit/*.md
      - contrib/rqbit/maintained-series.txt
      - contrib/rqbit/*.sha256
      - contrib/rqbit/vendor/**
      - scripts/check-rqbit-maintained-patch-series.sh
      - scripts/check-rqbit-authoritative-restore-patch.sh
      - scripts/check-rqbit-discovery-health-patch.sh
      - scripts/check-rqbit-tracker-request-budget-patch.sh
      - scripts/check-rqbit-session-peer-budget-patch.sh
      - scripts/check-rqbit-pending-handshake-budget.sh
      - scripts/check-rqbit-known-peer-budget-patch.sh
      - scripts/check-rqbit-metadata-size-limit-patch.sh
      - scripts/check-rqbit-file-sizing-error-patch.sh
      - scripts/check-rqbit-peer-response-budget-patch.sh
      - scripts/check-rqbit-discovery-pressure-patch.sh
      - .github/workflows/rqbit-patches.yml
  pull_request:
    paths:
      - contrib/rqbit/*.patch
      - contrib/rqbit/*.md
      - contrib/rqbit/maintained-series.txt
      - contrib/rqbit/*.sha256
      - contrib/rqbit/vendor/**
      - scripts/check-rqbit-maintained-patch-series.sh
      - scripts/check-rqbit-authoritative-restore-patch.sh
      - scripts/check-rqbit-discovery-health-patch.sh
      - scripts/check-rqbit-tracker-request-budget-patch.sh
      - scripts/check-rqbit-session-peer-budget-patch.sh
      - scripts/check-rqbit-pending-handshake-budget.sh
      - scripts/check-rqbit-known-peer-budget-patch.sh
      - scripts/check-rqbit-metadata-size-limit-patch.sh
      - scripts/check-rqbit-file-sizing-error-patch.sh
      - scripts/check-rqbit-peer-response-budget-patch.sh
      - scripts/check-rqbit-discovery-pressure-patch.sh
      - .github/workflows/rqbit-patches.yml
  schedule:
    # Surface upstream-main drift even when nzbd has not changed.
    - cron: "29 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintained-series:
    name: "blocking: maintained rqbit v8.1.1 series / Rust 1.85"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rqbit-maintained-v8.1.1-1.85
      - name: Re-derive and test the shipped patch series
        run: scripts/check-rqbit-maintained-patch-series.sh

  authoritative-restore:
    name: ${{ matrix.name }} / authoritative restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Stable evidence blocks PRs. Upstream main still runs so drift is visible,
    # but it cannot block a PR when the independently moving branch changes.
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch"
            ref: v8.1.1
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rqbit-${{ matrix.ref }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-authoritative-restore-patch.sh "$RUNNER_TEMP/rqbit"

  discovery-health:
    name: ${{ matrix.name }} / discovery health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Match the restore job: test current main on PRs without letting upstream
    # drift veto a change whose stable evidence remains reproducible.
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch"
            ref: v8.1.1
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rqbit-${{ matrix.ref }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-discovery-health-patch.sh "$RUNNER_TEMP/rqbit"

  metadata-size-limit:
    name: ${{ matrix.name }} / metadata size limit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rqbit-metadata-size-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-metadata-size-limit-patch.sh "$RUNNER_TEMP/rqbit"

  file-sizing-error:
    name: ${{ matrix.name }} / file sizing error propagation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: 00b97485160ff5b5aa2b379ea0815d568ec665f0
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "blocking: documented rqbit main base"
            ref: 4e5f94cbcf1d57ec500885c77cf1e24d70232d89
            toolchain: stable
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: |
          git clone https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
          git -C "$RUNNER_TEMP/rqbit" checkout --detach "${{ matrix.ref }}"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rqbit-sizing-error-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-file-sizing-error-patch.sh "$RUNNER_TEMP/rqbit"

  tracker-request-budget:
    name: ${{ matrix.name }} / tracker request budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rqbit-tracker-budget-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-tracker-request-budget-patch.sh "$RUNNER_TEMP/rqbit"

  session-peer-budget:
    name: ${{ matrix.name }} / session peer budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rqbit-peer-budget-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-session-peer-budget-patch.sh "$RUNNER_TEMP/rqbit"

  pending-handshake-budget:
    name: ${{ matrix.name }} / pending handshake budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 backport / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main native boundary"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rqbit-handshake-budget-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Verify the stable backport or current native boundary
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-pending-handshake-budget.sh "$RUNNER_TEMP/rqbit"

  known-peer-budget:
    name: ${{ matrix.name }} / known peer budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rqbit-known-peer-budget-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rqbit/target
        run: scripts/check-rqbit-known-peer-budget-patch.sh "$RUNNER_TEMP/rqbit"

  peer-response-budget:
    name: ${{ matrix.name }} / peer response budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt
      - name: Clone rqbit ${{ matrix.ref }}
        run: git clone --branch "${{ matrix.ref }}" https://github.com/ikatson/rqbit.git "$RUNNER_TEMP/rqbit"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rqbit-peer-response-budget-${{ matrix.ref }}-${{ matrix.toolchain }}
          workspaces: ${{ runner.temp }}/rqbit -> target
      - name: Apply and test the contribution patch
        env:
