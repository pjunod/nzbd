    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ github.event_name == 'pull_request' && !matrix.blocking_on_pr }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "blocking: rqbit v8.1.1 patch / Rust 1.85"
            ref: v8.1.1
            toolchain: "1.85"
            blocking_on_pr: true
          - name: "drift: rqbit main patch"
            ref: main
            toolchain: stable
            blocking_on_pr: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
