[package]
name = "nzbd-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Kept off in the shipping daemon until #163 mounts the native torrent route.
torrent-admission = ["dep:nzbd-torrent"]

[dependencies]
nzbd-types = { workspace = true }
nzbd-config = { workspace = true }
nzbd-engine = { workspace = true }
nzbd-post = { workspace = true }
nzbd-nntp = { workspace = true }
nzbd-state = { workspace = true }
nzbd-torrent = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile = { workspace = true }
http-body-util = "0.1"
nzbd-nserv = { workspace = true }
nzbd-nzb = { workspace = true }
